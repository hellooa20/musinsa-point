spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:points;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  sql:
    init:
      mode: always

point:
  max-accrual-amount: 100000
  default-validity-days: 365
  expired-refund-validity-days: 7
  zone-id: Asia/Seoul
